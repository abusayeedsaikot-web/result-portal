<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result Portal</title><style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0}.wrap{max-width:760px;margin:50px auto;padding:20px}.card{background:#fff;padding:25px;border-radius:16px;margin:15px 0;box-shadow:0 4px 18px #0001}input,button{padding:12px;border-radius:9px;border:1px solid #ccd3dc;font-size:16px}input{width:100%;box-sizing:border-box}button{cursor:pointer;background:#172033;color:#fff;font-weight:bold}.row{display:flex;gap:10px}.row input{flex:1}.hidden{display:none}.status{font-weight:bold}.gpa{display:flex;gap:10px}.gpa div{flex:1;background:#f1f4f8;padding:15px;text-align:center;border-radius:10px}.tags span{display:inline-block;background:#edf1f5;padding:7px 10px;border-radius:20px;margin:3px}@media(max-width:600px){.row,.gpa{flex-direction:column}}</style></head><body><div class="wrap">
<div class="card"><h1>Result Portal</h1><p>Search result by Roll</p><form id="search"><div class="row"><input id="roll" maxlength="6" placeholder="6-digit Roll" required><button>Search</button></div></form></div>
<div id="msg"></div><div id="result" class="card hidden"></div>
<div class="card"><details><summary><b>Admin: Import Result PDF</b></summary><p><input id="key" type="password" placeholder="Admin Key"></p><p><input id="pdf" type="file" accept="application/pdf"></p><button id="import">Upload & Import PDF</button><p id="progress"></p></details></div>
</div><script>
const $=id=>document.getElementById(id);
let importing=false;
$('search').onsubmit=async e=>{e.preventDefault();if(importing){$('msg').textContent='PDF import is still running. Please wait until Import complete.';return}$('msg').textContent='Searching...';$('result').classList.add('hidden');const r=await fetch('/api/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roll:$('roll').value.trim()})});const d=await r.json();if(!r.ok){$('msg').textContent=d.message;return}const x=d.result;$('msg').textContent='';$('result').innerHTML='<h2>Roll '+x.roll+'</h2><p>Status: <b>'+x.status+'</b></p><div class="gpa"><div>GPA1<br><b>'+x.gpa1+'</b></div><div>GPA2<br><b>'+x.gpa2+'</b></div><div>GPA3<br><b>'+x.gpa3+'</b></div></div><p>Exam Year: '+(x.exam_year||'—')+'</p><p>Referred Subjects: '+(x.ref_subjects||[]).join(', ')+'</p>'; $('result').classList.remove('hidden')};
$('import').onclick=async()=>{if(importing)return;const f=$('pdf').files[0];if(!f){$('progress').textContent='Select a PDF first.';return}importing=true;$('import').disabled=true;$('progress').textContent='Uploading PDF and extracting pages...';const fd=new FormData();fd.append('pdf',f);$('progress').textContent='Uploading and processing pages...';const r=await fetch('/api/admin/import-pdf',{method:'POST',headers:{'x-admin-key':$('key').value},body:fd});const d=await r.json();$('progress').textContent=d.ok?`Import complete: ${d.records} records from ${d.pages} pages. Database: ${d.databaseRecords}`:(d.message||'Import failed');importing=false;$('import').disabled=false;};
</script></body></html>
