<!d<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Result Portal</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  margin:0
}

.wrap{
  max-width:760px;
  margin:50px auto;
  padding:20px
}

.card{
  background:#fff;
  padding:25px;
  border-radius:16px;
  margin:15px 0;
  box-shadow:0 4px 18px #0001
}

input,button{
  padding:12px;
  border-radius:9px;
  border:1px solid #ccd3dc;
  font-size:16px
}

input{
  width:100%;
  box-sizing:border-box
}

button{
  cursor:pointer;
  background:#172033;
  color:#fff;
  font-weight:bold
}

button:disabled{
  opacity:.6;
  cursor:not-allowed
}

.row{
  display:flex;
  gap:10px
}

.row input{
  flex:1
}

.hidden{
  display:none
}

.status{
  font-weight:bold
}

.gpa{
  display:flex;
  gap:10px
}

.gpa div{
  flex:1;
  background:#f1f4f8;
  padding:15px;
  text-align:center;
  border-radius:10px
}

.tags span{
  display:inline-block;
  background:#edf1f5;
  padding:7px 10px;
  border-radius:20px;
  margin:3px
}

.file-info{
  margin-top:10px;
  padding:10px;
  background:#f1f4f8;
  border-radius:9px
}

.progress-box{
  margin-top:15px;
  white-space:pre-line
}

@media(max-width:600px){
  .row,.gpa{
    flex-direction:column
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- Result Search -->
  <div class="card">
    <h1>Result Portal</h1>
    <p>Search result by Roll</p>

    <form id="search">
      <div class="row">
        <input
          id="roll"
          maxlength="6"
          placeholder="6-digit Roll"
          required
        >
        <button type="submit">Search</button>
      </div>
    </form>
  </div>


  <div id="msg"></div>

  <div id="result" class="card hidden"></div>


  <!-- Admin PDF Import -->
  <div class="card">

    <details>

      <summary>
        <b>Admin: Import Result PDFs</b>
      </summary>

      <p>
        <input
          id="key"
          type="password"
          placeholder="Admin Key"
        >
      </p>

      <p>
        <input
          id="pdf"
          type="file"
          accept=".pdf,application/pdf"
          multiple
        >
      </p>

      <div id="fileInfo" class="file-info">
        No PDF selected.
      </div>

      <br>

      <button id="import">
        Upload & Import PDFs
      </button>

      <div
        id="progress"
        class="progress-box"
      ></div>

    </details>

  </div>

</div>


<script>

const $ = id => document.getElementById(id);

let importing = false;


// ======================================
// Roll Search
// ======================================

$('search').onsubmit = async e => {

  e.preventDefault();

  if(importing){

    $('msg').textContent =
      'PDF import is still running. Please wait until Import complete.';

    return;
  }

  $('msg').textContent = 'Searching...';

  $('result').classList.add('hidden');

  try{

    const r = await fetch('/api/result',{

      method:'POST',

      headers:{
        'Content-Type':'application/json'
      },

      body:JSON.stringify({
        roll:$('roll').value.trim()
      })

    });

    const d = await r.json();

    if(!r.ok){

      $('msg').textContent =
        d.message || 'No result found.';

      return;
    }

    const x = d.result;

    $('msg').textContent = '';

    $('result').innerHTML = `

      <h2>Roll ${x.roll}</h2>

      <p>
        Status:
        <b>${x.status || ''}</b>
      </p>

      <div class="gpa">

        <div>
          GPA1<br>
          <b>${x.gpa1 || ''}</b>
        </div>

        <div>
          GPA2<br>
          <b>${x.gpa2 || ''}</b>
        </div>

        <div>
          GPA3<br>
          <b>${x.gpa3 || ''}</b>
        </div>

      </div>

      <p>
        Exam Year:
        ${x.exam_year || '—'}
      </p>

      <p>
        Referred Subjects:
        ${(x.ref_subjects || []).join(', ')}
      </p>

    `;

    $('result').classList.remove('hidden');

  }catch(e){

    $('msg').textContent =
      'Search failed. Please try again.';

  }

};


// ======================================
// PDF Selection
// ======================================

$('pdf').addEventListener('change', () => {

  const files = $('pdf').files;

  if(files.length === 0){

    $('fileInfo').textContent =
      'No PDF selected.';

    return;
  }

  if(files.length > 10){

    $('fileInfo').textContent =
      'Maximum 10 PDFs can be selected.';

    $('pdf').value = '';

    return;
  }

  let text =
    `${files.length} PDF selected:\n\n`;

  for(let i = 0; i < files.length; i++){

    text +=
      `${i + 1}. ${files[i].name}\n`;

  }

  $('fileInfo').textContent = text;

});


// ======================================
// Multiple PDF Import
// ======================================

$('import').onclick = async () => {

  if(importing) return;

  const files = $('pdf').files;

  // Check PDF
  if(!files || files.length === 0){

    $('progress').textContent =
      'Select at least one PDF first.';

    return;
  }

  // Maximum 10
  if(files.length > 10){

    $('progress').textContent =
      'Maximum 10 PDFs can be uploaded at once.';

    return;
  }

  // Check admin key
  const adminKey =
    $('key').value.trim();

  if(!adminKey){

    $('progress').textContent =
      'Enter Admin Key first.';

    return;
  }


  importing = true;

  $('import').disabled = true;

  $('progress').textContent =
    `Uploading ${files.length} PDF(s)...\n\nPlease wait.`;


  try{

    const fd = new FormData();


    // Add every PDF using the same field name: pdf
    for(const file of files){

      fd.append('pdf', file);

    }


    const r = await fetch(
      '/api/admin/import-pdf',
      {
        method:'POST',

        headers:{
          'x-admin-key':adminKey
        },

        body:fd
      }
    );


    const d = await r.json();


    if(!r.ok || !d.ok){

      $('progress').textContent =
        d.message || 'Import failed.';

      return;
    }


    // Show individual PDF results

    let output =
      '✅ All PDFs imported successfully.\n\n';

    if(d.files){

      for(const item of d.files){

        output +=
          `📄 ${item.file}\n` +
          `Pages: ${item.pages}\n` +
          `Records: ${item.records}\n\n`;

      }

    }


    output +=
      `Database total records: ${d.databaseRecords}`;

    $('progress').textContent = output;


  }catch(e){

    console.error(e);

    $('progress').textContent =
      'Import failed: ' +
      (e.message || 'Unknown error.');

  }finally{

    importing = false;

    $('import').disabled = false;

  }

};

</script>

</body>
</html>
